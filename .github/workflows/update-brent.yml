name: Mise à jour quotidienne du cours du Brent

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-brent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le cours du Brent
        env:
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
        run: |
          set -e
          response=$(curl -s "https://api.oilpriceapi.com/v1/prices/latest?by_code=BRENT_CRUDE_USD" \
            -H "Authorization: Token $OILPRICE_API_KEY")

          price=$(echo "$response" | jq -r 'if type=="array" then .[0].data.price else .data.price end // empty')
          asof=$(echo "$response" | jq -r 'if type=="array" then .[0].data.as_of else .data.as_of end // empty')

          if [ -z "$price" ]; then
            echo "Réponse API invalide, on garde brent.json inchangé :"
            echo "$response"
            exit 0
          fi

          jq -n --argjson price "$price" --arg date "$asof" --arg source "oilpriceapi.com" \
            '{price: $price, date: $date, source: $source}' > brent.json
          cat brent.json

      - name: Publier si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- brent.json; then
            git add brent.json
            git commit -m "Mise à jour automatique du cours du Brent"
            git push
          else
            echo "Aucun changement."
          fi
