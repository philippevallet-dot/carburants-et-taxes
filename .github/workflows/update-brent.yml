name: Mise à jour quotidienne du Brent et des prix à la pompe

on:
  schedule:
    # 06:00 UTC chaque jour (≈ 08:00 heure de Paris en été, 07:00 en hiver)
    - cron: - cron: '23 4,10,16 * * *'
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-brent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le cours du Brent
        env:
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
        run: |
          set -e
          response=$(curl -s "https://api.oilpriceapi.com/v1/prices/latest?by_code=BRENT_CRUDE_USD" \
            -H "Authorization: Token $OILPRICE_API_KEY")

          price=$(echo "$response" | jq -r 'if type=="array" then .[0].data.price else .data.price end // empty')
          asof=$(echo "$response" | jq -r 'if type=="array" then .[0].data.as_of else .data.as_of end // empty')

          if [ -z "$price" ]; then
            echo "Réponse API invalide, on garde brent.json inchangé :"
            echo "$response"
            exit 0
          fi

          jq -n --argjson price "$price" --arg date "$asof" --arg source "oilpriceapi.com" \
            '{price: $price, date: $date, source: $source}' > brent.json
          cat brent.json

      - name: Récupérer les prix moyens à la pompe
        run: |
          set -e
          # Moyenne nationale des prix déclarés par les stations (données publiques du gouvernement).
          # Les valeurs hors de 1 à 4 €/L (erreurs de saisie) sont ignorées.
          API="https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records"
          moyenne() {
            curl -s --get "$API" \
              --data-urlencode "select=avg($1) as v, count($1) as n" \
              --data-urlencode "where=$1 > 1 and $1 < 4" \
              --data-urlencode "limit=1"
          }
          g=$(moyenne gazole_prix); s=$(moyenne sp95_prix); e=$(moyenne e10_prix)
          gv=$(echo "$g" | jq -r '.results[0].v // empty'); gn=$(echo "$g" | jq -r '.results[0].n // 0')
          sv=$(echo "$s" | jq -r '.results[0].v // empty')
          ev=$(echo "$e" | jq -r '.results[0].v // empty')

          if [ -z "$gv" ] || [ -z "$sv" ]; then
            echo "Réponse API invalide, on garde prix.json inchangé :"
            echo "$g"; echo "$s"
            exit 0
          fi

          jq -n --argjson g "$gv" --argjson s "$sv" --arg e "$ev" --argjson n "$gn" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg source "data.economie.gouv.fr" \
            '{gazole: ($g*1000|round/1000), sp95: ($s*1000|round/1000),
              e10: (if $e == "" then null else ($e|tonumber*1000|round/1000) end),
              stations: $n, date: $date, source: $source}' > prix.json
          cat prix.json

      - name: Publier si les fichiers ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brent.json prix.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour automatique du Brent et des prix à la pompe"
            git push
          else
            echo "Aucun changement."
          fi
