name: Nettoyage des branches de test
on: { push: { branches: [master], paths: [".github/workflows/nettoyage-branches.yml"] } }
permissions: { contents: write }
jobs:
  nettoyage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git push origin --delete debug-insee debug-insee2 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git rm .github/workflows/nettoyage-branches.yml
          git commit -m "Suppression du workflow de nettoyage (usage unique)"
          git push
